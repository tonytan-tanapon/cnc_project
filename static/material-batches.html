<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Materials · Batch Ledger — Topnotch MFG</title>

  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/crud-page.css" />
  <link rel="stylesheet"
        href="/static/vendor/tabulator/tabulator_modern.min.css" />

  <style>
  #addPanel {
    display: block;
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
    background: #f8f9fa;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
    overflow-x: auto;
  }

  .batch-form-row {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 14px;
    width: max-content;
    min-width: 100%;
    padding-bottom: 8px;
  }

  .batch-field {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
    width: auto;
  }

  .batch-field label {
    display: inline-block;
    margin: 0;
    white-space: nowrap;
  }

  .batch-field .form-control {
    flex: 0 0 auto;
    width: 110px;
    min-width: 0;
    box-sizing: border-box;
  }

  .batch-field--material .form-control {
    width: 280px;
  }

  .batch-field--supplier .form-control {
    width: 220px;
  }

  .batch-field--qty .form-control {
    width: 80px;
  }

  .batch-action {
    flex: 0 0 auto;
  }

  .batch-action .btn {
    white-space: nowrap;
  }
</style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div id="navSlot" data-nav-slot></div>
    </aside>

    <main class="main main--edge">
      <section class="panel panel--edge" id="listPanel">
        <div>Materials PO</div>

        <div class="list-topbar">Search 
          <input
            id="_q"
            type="search"
            class="search-lg"
            placeholder="batch/material/supplier..."
          />
        </div>

        <div id="addPanel">
          <div class="batch-form-row">

            <div class="batch-field">
              <label for="_batch_no">Batch No</label>
              <input id="_batch_no" class="form-control" />
            </div>

            <div class="batch-field batch-field--material">
              <label for="_material_id">Material</label>
              <input
                id="_material_id"
                class="form-control"
                list="materialList"
              />
              <datalist id="materialList"></datalist>
            </div>

            <div class="batch-field batch-field--supplier">
              <label for="_supplier_id">Supplier</label>
              <input
                id="_supplier_id"
                class="form-control"
                list="supplierList"
              />
              <datalist id="supplierList"></datalist>
            </div>

            <div class="batch-field">
              <label for="_heat_lot">Heat Lot</label>
              <input id="_heat_lot" class="form-control" />
            </div>

            <div class="batch-field">
              <label for="_size_text">Size</label>
              <input id="_size_text" class="form-control" />
            </div>

            <div class="batch-field">
              <label for="_length_text">Length</label>
              <input id="_length_text" class="form-control" />
            </div>

            <div class="batch-field batch-field--qty">
              <label for="_qty_received">Qty</label>
              <input
                id="_qty_received"
                class="form-control"
                type="number"
              />
            </div>

            <div class="batch-action">
              <button id="_save" class="btn btn-primary" type="button">
                +Add
              </button>
            </div>

            <div class="batch-action">
              <button
                id="_cancelAdd"
                class="btn btn-secondary"
                type="button" hidden
              >
                Cancel
              </button>
            </div>

          </div>
        </div>

        <div id="listBody"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
  </div>

  <script type="module" src="/static/js/nav-loader.js"></script>
  <script src="/static/vendor/tabulator/tabulator.min.js"></script>
  <script type="module"
          src="/static/js/page-batch-ledger.js?v=2.2"></script>
</body>

</html>

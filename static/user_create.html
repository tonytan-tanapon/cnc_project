<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create User</title>

    <link rel="stylesheet" href="/static/css/app.css">

    <style>
        .user-card {
            max-width: 520px;
            margin: 50px auto;
            padding: 24px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .user-card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .actions {
            margin-top: 20px;
        }

        .actions button {
            padding: 10px 18px;
            cursor: pointer;
        }

        #message {
            margin-top: 16px;
        }
    </style>
</head>

<body>

    <div class="user-card">

        <h2>Create User</h2>

        <div class="form-group">
            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                autocomplete="off"
            >
        </div>

        <div class="form-group">
            <label for="password">Temporary Password</label>
            <input
                id="password"
                type="password"
                autocomplete="new-password"
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                id="email"
                type="email"
            >
        </div>

        <div class="form-group">
            <label for="employee_id">Employee ID</label>
            <input
                id="employee_id"
                type="number"
            >
        </div>

        <div class="actions">
            <button id="createBtn">
                Create User
            </button>
        </div>

        <div id="message"></div>

    </div>

    <script
        type="module"
        src="/static/js/user_create.js">
    </script>

</body>
</html>
